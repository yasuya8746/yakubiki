org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# アプリの識別子(namespace と applicationId の両方に使う)。正式名は未定(D6)のため仮の値。
# 変更するときは、ここに加えて app/src/main/java 以下の Kotlin パッケージ(ディレクトリと package 宣言)も
# 同じ名前に変える(namespace が R / BuildConfig のパッケージになるため)。
yakubiki.applicationId=com.example.drugsearch
