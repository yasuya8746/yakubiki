name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ジョブ名 build は main のルールセットの必須チェックに使われている。変えないこと
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 差し替えられた gradle-wrapper.jar で任意のコードが動くのを防ぐ
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      # 検査はローカルでも同じスクリプトで実行できる(scripts/ci/)。ビルドより先に走らせて早く失敗させる
      - name: Self-test repository checks
        run: bash scripts/ci/test-checks.sh
      - name: Check secrets
        run: bash scripts/ci/check-secrets.sh
      - name: Check PMDA access
        run: bash scripts/ci/check-pmda-access.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lintDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Assemble debug
        run: ./gradlew assembleDebug
